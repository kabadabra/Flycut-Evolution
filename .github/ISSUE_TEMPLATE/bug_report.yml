name: Bug report
description: Report a problem with Flycut Evolution
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please use harmless sample text. Do not post clipboard history, passwords, API keys, or private logs."
  - type: input
    id: version
    attributes:
      label: Flycut Evolution version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 27.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a disposable clipping when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
