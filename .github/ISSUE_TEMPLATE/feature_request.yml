name: Feature request
description: Suggest an improvement to Flycut Evolution
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Flycut to help you do?
      description: Describe the workflow and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
    validations:
      required: true
