name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - run: swift test
      - run: scripts/build-app.sh debug
      - run: scripts/build-app.sh release
      - run: scripts/verify-app.sh 'build/Export/Flycut Evolution.app'
